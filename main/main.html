<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>

<div class="container">
    <!-- Поиск -->
    <header class="search-section">
        <div class="search-bar">
            <span class="icon">🔍</span>
            <input type="text" placeholder="Поиск" disabled>
        </div>
    </header>

    <!-- Профиль -->
    <section class="profile-header">
        <div class="user-info">
            <div class="avatar">А</div>
            <h1 class="username">Антон <span class="arrow">›</span></h1>
        </div>
        <div class="bonus-button">
            <span class="gift-icon">🎁</span> Бонус
            <span class="badge">1</span>
        </div>
    </section>

    <!-- Истории -->
    <!-- <section class="stories-container">
        <div class="story-card story-pension"><p>Пенсия</p></div>
        <div class="story-card story-atm"><p>Банкомат</p></div>
        <div class="story-card story-win"><p>Выигрыш</p></div>
        <div class="story-card story-home"><p>Дом</p></div>
    </section> -->

    <!-- Виджеты -->
    <section class="widget-grid">
        <div class="card operations-card">
            <h2 class="card-title">Все операции</h2>
            <p class="card-desc">Трат в апреле<br><strong>6 703 ₽</strong></p>
            <div class="multi-progress">
                <div class="segment blue" style="width: 45%;"></div>
                <div class="segment cyan" style="width: 20%;"></div>
                <div class="segment coral" style="width: 15%;"></div>
                <div class="segment orange" style="width: 20%;"></div>
            </div>
        </div>
        <div class="card cashback-card">
            <div class="card-header">
                <h2 class="card-title">Кэшбэк</h2>
                <span class="badge">1</span>
            </div>
            <div class="brand-icons">
                <div class="brand dodo"></div>
                <div class="brand vkusvill">ВВ</div>
                <div class="brand kari">kari</div>
            </div>
        </div>
    </section>

    <!-- Кнопки действий
    <section class="action-buttons">
        <button class="action-item"><div class="action-icon">➡</div><span>Перевести</span></button>
        <button class="action-item"><div class="action-icon">➕</div><span>Пополнить</span></button>
        <button class="action-item"><div class="action-icon">🔳</div><span>QR-код</span></button>
    </section> -->

    <!-- Карта/Счет -->
    <section class="account-card">
        <div class="account-info">
            <div class="account-main">
                <div class="account-icon">₽</div>
                <div class="account-details">
                    <span class="balance">823,54 ₽</span>
                    <span class="account-name">Black</span>
                </div>
            </div>
            <div class="points-badge">👑 2 P</div>
        </div>
        <div class="visual-card">
            <span class="card-numbers">9373</span>
            <span class="mir-logo">МИР</span>
        </div>
    </section>

    <!-- Секция бюджета (Раскрывающаяся) -->
    <section class="budget-section">
        <!-- <div class="budget-toggle" id="budget-toggle-btn">
            <span class="toggle-text">📊 Мой бюджет</span>
            <span class="toggle-icon">▼</span>
        </div> -->
        
        <div class="budget-content" id="budget-content">
            <!-- Сюда JS вставит контент -->
        </div>
    </section>

    <!-- Промо баннер -->
    <section class="promo-banner">
        <div class="promo-content">
            <h3>Верните на карту до 710 ₽</h3>
            <p>Посмотрите, как это сделать</p>
        </div>
        <div class="promo-img">💵</div>
    </section>
</div>

<!-- Нижнее меню -->

    <div class="nav-item">

        <span>Чат</span>
    </div>
