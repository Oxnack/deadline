<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <link rel="stylesheet" href="market.css">
</head>
<body>
    <!-- 1. ТЕХНИЧЕСКОЕ ОКНО (MODAL) -->
    <div id="tech-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Профиль пользователя</h2>
            <div class="form-group">
                <label>Имя:</label>
                <input type="text" id="user-name" value="Иван Иванов">
            </div>
            <div class="form-group">
                <label>Возраст:</label>
                <input type="number" id="user-age" value="25">
            </div>
            <div class="form-group">
                <label>Предпочтения:</label>
                <select id="user-pref">
                    <option value="healthy">Здоровое питание</option>
                    <option value="fastfood">Перекус / Пицца</option>
                    <option value="dairy">Молочные продукты</option>
                </select>
            </div>
            <button id="save-tech-data">Сохранить и загрузить ленту</button>
        </div>
    </div>

    <div class="app-container" id="main-app" style="display: none;">
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-top">
                <a href="../site/main.html" >
                <img src="images/back_arrow.jpg" class="icon-btn"></a>
                <div class="address-selector">
                    <span class="small-text">пр-кт Ленина, 192</span>
                    <span class="arrow-down">▼</span>
                </div>
                <img src="images/icon_orders.jpg" class="icon-btn">
            </div>
            <div class="search-box">
                <div class="search-bar">
                    <img src="images/search.jpg" class="search-icon">
                    <input type="text" placeholder="Поиск по продуктам">
                </div>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="content">
            <section class="feed-section">
                <div class="section-header">
                    <h2 id="category-title">Загрузка...</h2>
                    <a href="#" class="see-all">Все</a>
                </div>
                <div class="product-scroll" id="category-products">
                    <!-- Сюда вставятся товары через JS -->
                </div>
            </section>

            <section class="feed-section">
                <div class="section-header">
                    <h2>Вам понравится</h2>
                    <a href="#" class="see-all">Все</a>
                </div>
                <div class="product-scroll" id="recommendations">
                    <!-- Сюда вставятся рекомендации через JS -->
                </div>
            </section>
        </main>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <div class="nav-item active">
                <img src="images/nav_1.jpg">
                <span>Главная</span>
            </div>
            <div class="nav-item">
                <img src="images/nav_search.jpg">
                <span>Каталог</span>
            </div>
            <div class="nav-item cart-btn">
                <div class="cart-icon-wrapper">
                    <img src="images/nav_cart.jpg">
                    <span class="badge">1</span>
                </div>
                <span class="cart-price">51 ₽</span>
            </div>
        </nav>
    </div>

    <script src="market.js"></script>
</body>
</html>
