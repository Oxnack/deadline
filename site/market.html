<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace API</title>
    <link rel="stylesheet" href="market.css">
</head>
<body>
    <!-- ТЕХНИЧЕСКОЕ ОКНО -->
    <div id="tech-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Настройка профиля</h2>
            <div class="form-group">
                <label>Возраст:</label>
                <input type="number" id="user-age" value="25">
            </div>
            <div class="form-group">
                <label>Пол:</label>
                <select id="user-gender">
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                </select>
            </div>
            <div class="form-group">
                <label>Предпочтение (0-100):</label>
                <input type="range" id="user-pref-score" value="50">
            </div>
            <button id="save-tech-data">Загрузить рекомендации</button>
        </div>
    </div>

    <div class="app-container" id="main-app" style="display: none;">
        <!-- HEADER -->
        <header class="app-header">
            <div class="header-top">
                <img src="images/back_arrow.jpg" class="icon-btn">
                <div class="address-selector">
                    <span class="small-text">пр-кт Ленина, 192</span>
                </div>
                <img src="images/icon_orders.jpg" class="icon-btn">
            </div>
            <div class="search-box">
                <div class="search-bar">
                    <img src="images/search.jpg" class="search-icon">
                    <input type="text" placeholder="Поиск по продуктам">
                </div>
            </div>
        </header>

        <!-- БЛОК СТАТИСТИКИ (СРЕДНИЕ ЗНАЧЕНИЯ) -->
        <div id="category-stats" class="stats-bar">
            <!-- Сюда придут данные из API -->
        </div>

        <!-- CONTENT -->
        <main class="content">
            <section class="feed-section">
                <div class="section-header">
                    <h2>Рекомендации:</h2>
                </div>
                <div class="product-grid" id="recommendations">
                    <!-- Товары из API -->
                </div>
            </section>
        </main>

        <!-- КОРЗИНА (ВИДЖЕТ) -->
        <div id="cart-widget" class="cart-widget">
            <div class="cart-info">
                <div class="cart-icon-wrapper">
                    <img src="images/nav_cart.jpg">
                    <span id="cart-count" class="badge">0</span>
                </div>
                <span id="cart-total">0 ₽</span>
            </div>
            <button class="checkout-btn">В корзину</button>
        </div>

        <!-- NAVIGATION -->
        <nav class="bottom-nav">
            <div class="nav-item active"><img src="images/nav_1.jpg"><span>Главная</span></div>
            <div class="nav-item"><img src="images/nav_search.jpg"><span>Каталог</span></div>
            <div class="nav-item"><img src="images/nav_3.jpg"><span>Профиль</span></div>
        </nav>
    </div>

    <script src="market.js"></script>
</body>
</html>
