<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Т-Маркет Супермаркеты</title>
    <link rel="stylesheet" href="market.css">
</head>
<body>
    <!-- ТЕХНИЧЕСКОЕ ОКНО С ДАННЫМИ ДЛЯ МОДЕЛИ -->
    <div id="tech-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Параметры пользователя (API)</h3>
            <div class="scroll-form">
                <div class="form-grid">
                    <label>Возраст: <input type="number" id="age" value="32"></label>
                    <label>Доход: <input type="number" id="income_rub" value="95000"></label>
                    <label>Средний чек: <input type="number" id="avg_ticket" value="1700"></label>
                    <label>Транзакций: <input type="number" id="txn_count" value="18"></label>
                    <label>Доставка (%): <input type="number" step="0.1" id="delivery_share" value="0.22"></label>
                    <label>Выходные (%): <input type="number" step="0.1" id="weekend_share" value="0.55"></label>
                    <!-- Остальные поля скрыты или дефолтны для удобства, но отправляются -->
                </div>
                <p class="hint">* На самом деле категория на основе 19 признаков которые в реале получаются из действий и транзакций пользователя (сейчас данные синтетика)</p>
            </div>
            <button id="predict-btn">Определить сегмент и войти</button>
        </div>
    </div>

    <div class="app-container" id="main-app" style="display: none;">
        <!-- HEADER (Обновленная панель) -->
        <header class="app-header">
            <div class="header-main">
                 <a href="../site/main.html" >
                <img src="images/back_arrow.jpg" class="nav-icon"></a>
                <div class="address-box">
                    <span class="addr-title">Супермаркет</span>
                    <span class="addr-current">пр-кт Ленина, 192</span>
                </div>
                <img src="images/icon_orders.png" class="nav-icon">
            </div>
            <div class="search-wrap">
                <div class="search-input">
                    <img src="images/icon_search.png">
                    <input type="text" placeholder="Поиск в Т-Маркете">
                </div>
            </div>
        </header>

        <section class="balance-section">
            <div class="balance-card">
                <span class="balance-label">Баланс на еду</span>
                <span class="balance-amount" id="food-balance" style="color: rgb(52, 199, 89);">30&nbsp;000 ₽</span>
            </div>
        </section>
        
        <!-- СРЕДНИЕ ЗНАЧЕНИЯ (API: segment/stats) -->
        <div class="stats-scroll" id="stats-bar">
            <!-- Сюда подгрузится статистика -->
        </div>

        <!-- КАТЕГОРИЯ И РЕКОМЕНДАЦИИ -->
        <main class="main-content">
            <div class="section-title">
                <h2 id="segment-name">Загрузка...</h2>
                <span class="confidence" id="confidence-val"></span>
            </div>
            
            <div class="product-grid" id="product-list">
                <!-- Карточки товаров -->
            </div>
        </main>

        <!-- НИЖНЯЯ ПАНЕЛЬ -->
        <nav class="bottom-nav">
            <div class="nav-tab active">
                <img src="images/nav_main.png">
                <span>Главная</span>
            </div>
            <div class="nav-tab">
                <img src="images/nav_search.jpg">
                <span>Каталог</span>
            </div>
            <div class="nav-tab cart-trigger">
                <div class="cart-counter" id="cart-count">0</div>
                <img src="images/nav_cart.jpg">
                <span id="cart-total-price">0 ₽</span>
            </div>
        </nav>
    </div>

    <script src="market.js"></script>
</body>
</html>
